name: Windows slow-audio watchdog fix

on:
  push:
    branches: [fix/slow-audio-watchdog]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install pinned dependencies
        shell: pwsh
        run: python -m pip install -r requirements-build.txt

      - name: Compile and test original CLI and tray
        shell: pwsh
        run: |
          python -m py_compile wetype_audio_guard.py wetype_audio_tray.py tray_runtime.py tray_platform.py tray_icon.py tray_windows.py packaging_smoke.py
          python wetype_audio_guard.py --self-test
          python -m unittest discover -v

      - name: Build Windows EXE without changing stable release
        shell: pwsh
        run: python tools/build_windows_exe.py

      - name: Verify frozen imports and simulated tray/worker startup
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/WeTypeAudioGuard.exe'
          foreach ($arg in @('--package-smoke-test','--frozen-tray-smoke-test')) {
            $p = Start-Process -FilePath $exe -ArgumentList $arg -PassThru
            if (-not $p.WaitForExit(90000)) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw "Smoke test timed out: $arg"
            }
            if ($p.ExitCode -ne 0) { throw "Smoke test failed $arg : $($p.ExitCode)" }
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $expected = (Get-Content 'dist/WeTypeAudioGuard.exe.sha256' -Raw).Split(' ')[0].ToUpperInvariant()
          if ($hash -ne $expected) { throw 'SHA-256 mismatch' }

      - name: Upload test-only Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: WeTypeAudioGuard-slow-watchdog-test
          path: dist/WeTypeAudioGuard.exe
          retention-days: 7
          if-no-files-found: error
