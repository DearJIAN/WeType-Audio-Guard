          if (-not (Test-Path $zip)) { throw 'Release ZIP not generated' }

      - name: Publish GitHub Release and verify assets
        if: steps.release.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          $zip = "dist/WeTypeAudioGuard-$version-windows-x64.zip"
          $notes = "docs/release-notes-$tag.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }
          gh release create $tag dist/WeTypeAudioGuard.exe $zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "WeType Audio Guard $version" --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release command failed' }
          $assets = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          foreach ($file in @('WeTypeAudioGuard.exe', "WeTypeAudioGuard-$version-windows-x64.zip")) {
            if ($assets -notcontains $file) { throw "Missing Release asset: $file" }
          }
          Write-Host "Published and verified $tag"
