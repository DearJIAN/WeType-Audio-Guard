name: Windows release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/windows-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Select version and check for existing release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne '1.0.0') { throw "Unsupported release version: $version" }
          $tag = "v$version"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists; never overwrite published assets."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Set up Python x64
        if: steps.release.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install dependencies
        if: steps.release.outputs.skip == 'false'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Compile and run CLI + tray regression tests
        if: steps.release.outputs.skip == 'false'
        shell: pwsh
        run: |
          python -m py_compile wetype_audio_guard.py wetype_audio_tray.py tray_runtime.py tray_platform.py tray_windows.py tray_icon.py tools/packaging_entry.py tools/build_windows_exe.py
          python wetype_audio_guard.py --self-test
          python -m unittest discover -v

      - name: Build independent Windows EXE
        if: steps.release.outputs.skip == 'false'
        shell: pwsh
        run: python tools/build_windows_exe.py

      - name: Frozen import test and SHA-256 verification (no audio writes)
        if: steps.release.outputs.skip == 'false'
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/WeTypeAudioGuard.exe'
          if (-not (Test-Path $exe)) { throw 'EXE was not generated' }
          $proc = Start-Process -FilePath $exe -ArgumentList '--package-smoke-test' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Frozen import test failed: $($proc.ExitCode)" }
          $expected = (Get-Content dist/WeTypeAudioGuard.exe.sha256 -Raw).Split(' ')[0].Trim().ToUpperInvariant()
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw 'SHA256 mismatch' }

      - name: Bundle EXE and all applicable notices
        if: steps.release.outputs.skip == 'false'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item dist/WeTypeAudioGuard.exe, dist/WeTypeAudioGuard.exe.sha256, README.md, LICENSE, CHANGELOG.md, THIRD_PARTY_NOTICES.md -Destination dist/package
          Copy-Item licenses -Destination dist/package/licenses -Recurse
          Compress-Archive -Path dist/package/* -DestinationPath dist/WeTypeAudioGuard-1.00-windows-x64.zip -Force
          if (-not (Test-Path dist/WeTypeAudioGuard-1.00-windows-x64.zip)) { throw 'ZIP was not generated' }

      - name: Publish official GitHub Release
        if: steps.release.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.0'
          gh release create $tag dist/WeTypeAudioGuard.exe dist/WeTypeAudioGuard.exe.sha256 dist/WeTypeAudioGuard-1.00-windows-x64.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'WeType Audio Guard 1.00' --notes-file docs/release-notes-v1.0.0.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release command failed' }
          $names = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          foreach ($item in @('WeTypeAudioGuard.exe', 'WeTypeAudioGuard.exe.sha256', 'WeTypeAudioGuard-1.00-windows-x64.zip')) {
            if ($names -notcontains $item) { throw "Missing release asset: $item" }
          }
          Write-Host "Published $tag, assets: $($names -join ', ')"
