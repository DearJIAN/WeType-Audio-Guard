name: Windows release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/windows-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Determine version and avoid overwriting releases
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+(\.\d+)?$') { throw 'Invalid VERSION file' }
          $tag = "v$version"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $existing = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query existing releases' }
          if ($existing -contains $tag) {
            Write-Host "Release $tag already exists; do not overwrite."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Configure Python
        if: steps.release.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install build dependencies
        if: steps.release.outputs.skip == 'false'
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt

      - name: Compile and run regression tests
        if: steps.release.outputs.skip == 'false'
        shell: pwsh
        run: |
          python -m py_compile wetype_audio_guard.py wetype_audio_tray.py tray_runtime.py tray_platform.py tray_logs.py tray_windows.py tray_icon.py tools/packaging_entry.py tools/build_windows_exe.py packaging_smoke.py
          python wetype_audio_guard.py --self-test
          python -m unittest discover -v

      - name: Build one-file Windows EXE
        if: steps.release.outputs.skip == 'false'
        shell: pwsh
        run: python tools/build_windows_exe.py

      - name: Test actual frozen EXE imports and isolated tray/child lifecycle
        if: steps.release.outputs.skip == 'false'
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/WeTypeAudioGuard.exe'
          if (-not (Test-Path $exe)) { throw 'EXE was not built' }
          foreach ($flag in @('--package-smoke-test', '--frozen-tray-smoke-test')) {
            $proc = Start-Process -FilePath $exe -ArgumentList $flag -PassThru
            if (-not $proc.WaitForExit(90000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "EXE smoke test timed out: $flag"
            }
            if ($proc.ExitCode -ne 0) { throw "EXE smoke test failed: $flag, exit $($proc.ExitCode)" }
          }
          $expected = (Get-Content dist/WeTypeAudioGuard.exe.sha256 -Raw).Split(' ')[0].Trim().ToUpperInvariant()
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw 'SHA-256 mismatch' }

      - name: Bundle full licensing notices with EXE
        if: steps.release.outputs.skip == 'false'
        shell: pwsh
        run: |
          $required = @('psutil-BSD-3-Clause.txt', 'Pillow-MIT-CMU.txt', 'pycaw-MIT.txt', 'comtypes-MIT.txt', 'six-MIT.txt', 'pystray-LGPL-3.0.txt', 'GPL-3.0.txt', 'PyInstaller-COPYING.txt')
          foreach ($file in $required) {
            if (-not (Test-Path "licenses/$file")) { throw "Missing license $file" }
          }
          $version = (Get-Content VERSION -Raw).Trim()
          $zip = "dist/WeTypeAudioGuard-$version-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item dist/WeTypeAudioGuard.exe, README.md, LICENSE, CHANGELOG.md, THIRD_PARTY_NOTICES.md -Destination dist/package
          Copy-Item licenses -Destination dist/package/licenses -Recurse
          Compress-Archive -Path dist/package/* -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw 'Release ZIP not generated' }

      - name: Publish GitHub Release and verify assets
        if: steps.release.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          $zip = "dist/WeTypeAudioGuard-$version-windows-x64.zip"
          $notes = "docs/release-notes-$tag.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }
          gh release create $tag dist/WeTypeAudioGuard.exe $zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "WeType Audio Guard $version" --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release command failed' }
          $assets = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          foreach ($file in @('WeTypeAudioGuard.exe', "WeTypeAudioGuard-$version-windows-x64.zip")) {
            if ($assets -notcontains $file) { throw "Missing Release asset: $file" }
          }
          Write-Host "Published and verified $tag"
