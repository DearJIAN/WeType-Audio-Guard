name: Windows v1.0.1 verification

on:
  push:
    branches:
      - fix/v1.0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install pinned dependencies
        shell: pwsh
        run: python -m pip install -r requirements-build.txt

      - name: Compile and run regression tests
        shell: pwsh
        run: |
          python -m py_compile wetype_audio_guard.py wetype_audio_tray.py tray_runtime.py tray_platform.py tray_windows.py tray_icon.py tools/packaging_entry.py tools/build_windows_exe.py packaging_smoke.py
          python wetype_audio_guard.py --self-test
          python -m unittest discover -v

      - name: Build actual Windows EXE
        shell: pwsh
        run: python tools/build_windows_exe.py

      - name: Frozen EXE import and native tray/worker smoke tests
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/WeTypeAudioGuard.exe'
          foreach ($flag in @('--package-smoke-test', '--frozen-tray-smoke-test')) {
            $proc = Start-Process -FilePath $exe -ArgumentList $flag -PassThru
            if (-not $proc.WaitForExit(90000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "Timed out: $flag"
            }
            if ($proc.ExitCode -ne 0) { throw "Frozen smoke failed: $flag, code $($proc.ExitCode)" }
          }
          $expected = (Get-Content dist/WeTypeAudioGuard.exe.sha256 -Raw).Split(' ')[0].Trim().ToUpperInvariant()
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'SHA256 mismatch' }

      - name: Verify bundled third-party license files exist
        shell: pwsh
        run: |
          foreach ($license in @('psutil-BSD-3-Clause.txt', 'Pillow-MIT-CMU.txt', 'pycaw-MIT.txt', 'comtypes-MIT.txt', 'six-MIT.txt', 'pystray-LGPL-3.0.txt', 'GPL-3.0.txt', 'PyInstaller-COPYING.txt')) {
            if (-not (Test-Path "licenses/$license")) { throw "Missing $license" }
          }
